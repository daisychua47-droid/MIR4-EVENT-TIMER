<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIR4 Event Timer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <img src="logo.png" class="logo">

    <input
        type="text"
        id="search"
        placeholder="Search boss..."
    >

    <select id="world">
        <option value="">All Worlds</option>
    </select>

    <select id="map">
        <option value="">All Maps</option>
    </select>

</header>

<main class="container">

    <!-- LIVE NOW -->
    <section class="card live-card">

        <div class="card-header">
            <h2>🟢 LIVE NOW</h2>
            <span id="aliveCount">0 Bosses</span>
        </div>

       <div id="liveBossList" class="boss-list">

            <div class="boss-card">
        
                <div class="boss-info">
        
                    <div class="boss-name">
                        🟢 Redmoon Demon
                    </div>
        
                    <div class="boss-location">
                        World 5 • Snake Pit • Layer 2
                    </div>
        
                </div>
        
                <div class="boss-right">
        
                    <div class="boss-time">
                        18:42
                    </div>
        
                    <button class="btn-defeat">
                        Finish
                    </button>
        
                </div>
        
            </div>
        
            <div class="boss-card">
        
                <div class="boss-info">
        
                    <div class="boss-name">
                        🟢 Black Dragon
                    </div>
        
                    <div class="boss-location">
                        World 3 • Secret Peak • Layer 4
                    </div>
        
                </div>
        
                <div class="boss-right">
        
                    <div class="boss-time">
                        07:58
                    </div>
        
                    <button class="btn-defeat">
                        Finish
                    </button>
        
                </div>
        
            </div>
        
        </div>

    </section>


    <!-- DEFEATED + UPCOMING -->
    <div class="bottom-grid">

        <!-- Recently Defeated -->
        <section class="card small-card">

            <div class="card-header">
                <h2>⚫ Recently Defeated</h2>
            </div>

          <div id="defeatedList" class="mini-list">
                <p>Black Dragon</p>
                <p>Redmoon Demon</p>
            </div>

        </section>


        <!-- Upcoming -->
        <section class="card">

            <div class="card-header">
                <h2>🕒 Upcoming Bosses</h2>
            </div>

            <div id="upcomingList" class="boss-list">
                <p>Nefariox</p>
                <p>Blue Dragon</p>
                <p>Dark Lord</p>
            </div>

        </section>

    </div>

</main>

<script src="api.js"></script>
<script src="app.js"></script>

</body>

</html>
