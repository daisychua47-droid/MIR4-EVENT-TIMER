<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIR4 Event Timer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <img src="logo.png" class="logo">

    <input
        type="text"
        id="search"
        placeholder="Search boss..."
    >

    <select id="world">
        <option value="">All Worlds</option>
    </select>

    <select id="map">
        <option value="">All Maps</option>
    </select>

</header>

<main class="container">

    <section class="card">

        <div class="card-header">

            <h2>🟢 ACTIVE BOSSES</h2>

            <span id="aliveCount">0 Alive</span>

        </div>

        <table id="bossTable">

            <thead>

                <tr>

                    <th>Status</th>
                    <th>Boss</th>
                    <th>World</th>
                    <th>Map</th>
                    <th>Layer</th>
                    <th>Spawn</th>
                    <th>Time Left</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </section>

</main>

<script src="api.js"></script>
<script src="app.js"></script>

</body>

</html>
