<header class="topbar">

    <img src="images/logo.png" class="logo">

    <input
        type="text"
        id="search"
        placeholder="Search boss..."
    >

    <select id="world">
        <option value="">All Worlds</option>
    </select>

    <select id="map">
        <option value="">All Maps</option>
    </select>

</header>

<main class="container">

    <section class="card">

        <div class="card-header">

            <h2>🟢 ACTIVE BOSSES</h2>

            <span id="aliveCount">0 Alive</span>

        </div>

        <table id="bossTable">

            <thead>

                <tr>

                    <th>Status</th>
                    <th>Boss</th>
                    <th>World</th>
                    <th>Map</th>
                    <th>Layer</th>
                    <th>Spawn</th>
                    <th>Time Left</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </section>

</main>

<script src="api.js"></script>
<script src="app.js"></script>
