<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MIR4 Event Timer</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<header class="topbar">

    <img src="logo.png" class="logo">

   <div class="search-box">
        <input
            type="text"
            id="search"
            placeholder="Search boss..."
            autocomplete="off"
        >
    
        <button
            type="button"
            id="clearSearch"
            class="clear-search">
            ×
        </button>
    </div>

    <select id="world">
        <option value="">All Worlds</option>
    </select>

    <select id="map">
        <option value="">All Maps</option>
    </select>

    <div class="theme-toggle" id="themeToggle">
        <button
            type="button"
            id="themeButton"
            onclick="toggleTheme()">
            ☀️ Light
        </button>
    </div>


    <div class="game-clock">

        <div class="clock-zone">
            <span class="clock-dot"></span>
            Asia/Manila
        </div>
    
        <div class="clock-time" id="gameClock">
            00:00:00 AM
        </div>
    
        <div class="clock-date" id="gameDate">
            Jan 01, 2026
        </div>
    
    </div>

</header>

<main class="container">

      <!-- LIVE NOW -->
        <section class="card live-card">
        
            <div class="card-header">
                <h2>🟢 LIVE NOW</h2>
                <span id="aliveCount">0 Bosses</span>
            </div>
        
            <div class="table-wrapper">
                <div id="liveBossList" class="boss-list"></div>
            </div>
        
        </section>


    <!-- SPAWNING SOON -->
        <section class="card soon-card">
        
            <div class="card-header">
                <h2>🟡 SPAWNING SOON</h2>
                <span id="soonCount">0 Bosses</span>
            </div>
        
            <div class="table-wrapper">
                <div id="soonBossList" class="boss-list"></div>
            </div>
        
        </section>



    <!-- DEFEATED + UPCOMING -->
    <div class="bottom-grid">

        <!-- Recently Defeated -->
        <section class="card small-card">

            <div class="card-header">
                <h2>⚫ Recently Defeated</h2>
            </div>

         <div class="table-wrapper">
            <div id="defeatedList" class="mini-list"></div>
        </div>

        </section>


        <!-- Upcoming -->
        <section class="card">

            <div class="card-header">
                <h2>🕒 Upcoming Bosses</h2>
            </div>

           <div class="table-wrapper">
                <div id="upcomingList" class="boss-list"></div>
            </div>

        </section>

    </div>

</main>

<script src="api.js"></script>
<script src="app.js"></script>


<!-- Boss Details Modal -->
<div id="bossModal" class="boss-modal">

    <div class="boss-modal-content">

        <span class="boss-close" onclick="closeBossModal()">
            &times;
        </span>

        <div id="bossModalBody"></div>

    </div>

</div> 


<div class="bottom-ad">

    <div class="bottom-ad-brand">
        <img
            src="GAMETOPUPZONE LOGO.png"
            alt="GAMETOPUPZONE">
    </div>

    <div class="bottom-ad-title">
        SELLING MIR4 GOLD — ALL SERVER
    </div>

    <div class="bottom-ad-links">

        <a
            href="https://discord.gg/hYqXJPyVjw"
            target="_blank"
            rel="noopener noreferrer">
            Discord: <b>JOIN NOW</b>
        </a>

        <a
            href="https://facebook.com/share/16FTGzDfQ6/"
            target="_blank"
            rel="noopener noreferrer">
            Facebook: <b>VISIT PAGE</b>
        </a>

    </div>

</div>


</body>
</html>
